<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartBin Dashboard</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; text-align: center; padding: 20px; margin: 0; }
        .card { background: white; padding: 25px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 380px; margin: auto; }
        h1 { color: #333; font-size: 22px; margin-bottom: 20px; }
        .gauge-container { position: relative; margin: 20px 0; }
        .battery-status { font-size: 14px; color: #666; margin-top: 10px; }
        .status-badge { display: inline-block; padding: 6px 16px; border-radius: 20px; font-weight: bold; font-size: 14px; margin-top: 15px; }
        .ok { background-color: #e8f5e9; color: #2e7d32; }
        .full { background-color: #ffebee; color: #c62828; }
    </style>
</head>
<body>

<div class="card">
    <h1>🗑️ SmartBin Status</h1>
    
    <div style="font-size: 48px; font-weight: bold; color: #007bff;" id="bin-level">75%</div>
    <div style="color: #666; font-size: 14px;">ระดับขยะปัจจุบัน</div>

    <div id="status-badge" class="status-badge ok">สถานะ: ปกติ</div>

    <div class="battery-status">
        🔋 แบตเตอรี่ระบบ: <span id="battery">88%</span>
    </div>
</div>

<script>
    // ฟังก์ชันจำลอง/รับค่า Real-time
    function updateDashboard(level, battery) {
        document.getElementById('bin-level').innerText = level + '%';
        document.getElementById('battery').innerText = battery + '%';
        
        const badge = document.getElementById('status-badge');
        if (level >= 80) {
            badge.innerText = 'สถานะ: ขยะใกล้เต็ม!';
            badge.className = 'status-badge full';
        } else {
            badge.innerText = 'สถานะ: ปกติ';
            badge.className = 'status-badge ok';
        }
    }

    // ตัวอย่าง: เรียกใช้อัปเดตค่า
    updateDashboard(75, 88);
</script>

</body>
</html>
