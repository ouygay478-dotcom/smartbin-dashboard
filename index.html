<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartBin Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; font-family: 'Kanit', sans-serif; }
    body { background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
    .card { background: #ffffff; padding: 30px; border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); text-align: center; max-width: 380px; width: 100%; }
    .bin-icon { font-size: 70px; margin: 15px 0; }
    .status-badge { display: inline-block; padding: 8px 20px; border-radius: 50px; font-weight: 600; font-size: 1.1rem; margin-bottom: 20px; }
    .bg-green { background: #e8f5e9; color: #2e7d32; }
    .bg-red { background: #ffebee; color: #c62828; }
    .progress-container { background: #e0e0e0; border-radius: 12px; height: 18px; width: 100%; overflow: hidden; margin-bottom: 10px; }
    .progress-bar { background: #4caf50; height: 100%; width: 0%; transition: width 0.5s ease, background-color 0.5s ease; }
    .percent-text { font-size: 2rem; font-weight: 600; color: #333; margin: 10px 0 5px 0; }
    .timestamp { color: #888; font-size: 0.85rem; margin-top: 15px; }
  </style>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

  <div class="card">
    <h2>🗑️ สถานะถังขยะอัจฉริยะ</h2>
    <div class="bin-icon">🗑️</div>
    
    <div id="statusBadge" class="status-badge bg-green">กำลังโหลด...</div>
    
    <div class="progress-container">
      <div id="progressBar" class="progress-bar"></div>
    </div>
    
    <div class="percent-text" id="percentageText">0%</div>
    <div class="timestamp" id="lastUpdated">อัปเดตล่าสุด: -</div>
  </div>

  <script>
    // 1. นำค่า firebaseConfig จาก Firebase Console ของคุณมาวางตรงนี้
    const firebaseConfig = {
  apiKey: "AIzaSyBXNHL9rKCHhhzWyDgEffHEUHs4o5KIFQo",
  authDomain: "thanapat050-c7580.firebaseapp.com",
  databaseURL: "https://thanapat050-c7580-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "thanapat050-c7580",
  storageBucket: "thanapat050-c7580.firebasestorage.app",
  messagingSenderId: "199453229190",
  appId: "1:199453229190:web:59b9676084dc9553891107",
  measurementId: "G-QZKZQT3YFK"
};

    // เริ่มต้นใช้งาน Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // 2. กำหนด Path โหนดข้อมูลใน Firebase (ปรับให้ตรงกับที่คุณตั้งในโค้ดไมโครคอนโทรลเลอร์)
    const binRef = db.ref('smartbin');

    // 3. ดึงข้อมูลแบบ Real-time (ทำงานทันทีเมื่อค่าน้อยลง/มากขึ้น)
    binRef.on('value', (snapshot) => {
      const data = snapshot.val();
      if (!data) return;

      // สมมติโครงสร้างข้อมูล Firebase เช่น { isFull: false, percent: 15 }
      const isFull = data.isFull || false;
      const percent = data.percent || 0;

      const badge = document.getElementById('statusBadge');
      const bar = document.getElementById('progressBar');
      const percentText = document.getElementById('percentageText');
      const lastUpdated = document.getElementById('lastUpdated');

      percentText.innerText = percent + "%";
      bar.style.width = Math.min(percent, 100) + "%";

      if (isFull || percent >= 80) {
        badge.innerText = "🔴 ขยะเต็มแล้ว!";
        badge.className = "status-badge bg-red";
        bar.style.backgroundColor = "#e53935";
      } else {
        badge.innerText = "🟢 ขยะยังไม่เต็ม";
        badge.className = "status-badge bg-green";
        bar.style.backgroundColor = "#4caf50";
      }

      const now = new Date();
      lastUpdated.innerText = "อัปเดตล่าสุด: " + now.toLocaleTimeString('th-TH');
    });
  </script>
</body>
</html>
