<script>
        const firebaseConfig = {
            databaseURL: "https://thanapat050-c7580-default-rtdb.asia-southeast1.firebasedatabase.app"
        };

        if (typeof firebase === "undefined") {
            document.getElementById("lastUpdate").innerText = "โหลด Firebase SDK ไม่สำเร็จ";
            throw new Error("Firebase SDK failed to load");
        }

        try {
            firebase.initializeApp(firebaseConfig);
        } catch (e) {
            document.getElementById("lastUpdate").innerText = "Init Error: " + e.message;
        }

        // ตรวจสอบสถานะการเชื่อมต่อจริง
        const connectedRef = firebase.database().ref(".info/connected");
        connectedRef.on("value", (snap) => {
            const isConnected = snap.val() === true;
            setConnectionStatus(isConnected);
            if (isConnected) {
                document.getElementById("lastUpdate").innerText = "เชื่อมต่อ Firebase สำเร็จ กำลังรอข้อมูล...";
            } else {
                document.getElementById("lastUpdate").innerText = "สถานะ: ยังไม่สามารถเชื่อมต่อ WebSocket ได้";
            }
        });

        // ดึงข้อมูล
        const dbRef = firebase.database().ref("smartbin");
        dbRef.on("value", (snapshot) => {
            const data = snapshot.val();
            if (data !== null) {
                document.getElementById("lidStatus").innerText = data.lidStatus ?? "--";
                const percent = Number(data.percent ?? 0);
                document.getElementById("trashLevel").innerText = percent + "%";
                document.getElementById("progressBar").style.width = percent + "%";
                document.getElementById("binMode").innerText = data.mode ?? "--";
                document.getElementById("binDistance").innerText = (data.handDistance !== undefined ? data.handDistance : "--") + " cm";

                const now = new Date();
                document.getElementById("lastUpdate").innerText = "อัปเดตล่าสุด: " + now.toLocaleTimeString("th-TH");
            }
        }, (error) => {
            document.getElementById("lastUpdate").innerText = "Database Error: " + error.message;
        });

        function setConnectionStatus(isConnected) {
            const badge = document.getElementById("statusBadge");
            const text = document.getElementById("statusText");
            if (isConnected) {
                badge.className = "status-badge connected";
                text.innerText = "Connected";
            } else {
                badge.className = "status-badge disconnected";
                text.innerText = "Disconnected";
            }
        }
    </script>
